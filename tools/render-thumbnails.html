<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pack thumbnails (dev tool)</title>
<style>
  body{ font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; margin:24px; max-width:960px; color:#111; }
  h1{ font-size:18px; }
  #log{ white-space:pre-wrap; background:#f5f5f7; padding:16px; border-radius:6px; }
  #shots{ display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; }
  #shots img{ width:180px; background:#eee; border-radius:6px; }
  button{ font:inherit; padding:6px 14px; }
</style>
</head>
<body>
<h1>Pack thumbnails</h1>
<p>Renders each production platform we hold a model for, on a transparent
   background with the same studio lighting the hero uses, and writes the PNG
   into <code>assets/products/packs/</code>. Development tool: the site never
   loads this.</p>
<div><button id="go">Render all</button></div>
<div id="log">ready.</div>
<div id="shots"></div>

<script src="../assets/vendor/three.r128.min.js"></script>
<script src="../assets/vendor/fflate.min.js"></script>
<script src="../assets/vendor/FBXLoader.js"></script>
<script src="../assets/scripts/wstm-loader.js"></script>
<script src="../assets/scripts/wst-cad-colour.js"></script>
<script>
(function () {
  'use strict';
  var MODELS = [
    { file: 'assets/models/c4e.fbx',  out: 'assets/products/packs/compact-platform.png' },
    { file: 'assets/models/HDR.wstm', out: 'assets/products/packs/heavy-machinery-platform.png' },
    { file: 'assets/models/wl03.fbx', out: 'assets/products/packs/ups-platform.png' },
    { file: 'assets/models/sl02.fbx', out: 'assets/products/packs/agv-platform.png' },
    { file: 'assets/models/B7W.fbx',  out: 'assets/products/packs/heavy-machinery-chassis.png' }
  ];

  var MAT_RULES = [
    { test: 'lid', mat: 'lid' }, { test: 'cover', mat: 'lid' },
    { test: 'busbar', mat: 'busbar' }, { test: 'terminal', mat: 'busbar' },
    { test: 'board', mat: 'board' }, { test: 'pcb', mat: 'board' }, { test: 'bms', mat: 'board' },
    { test: 'cell', mat: 'cell' }, { test: 'highstar', mat: 'cell' }, { test: 'eve_c', mat: 'cell' },
    { test: 'harness', mat: 'cable' }, { test: 'cable', mat: 'cable' }, { test: 'wire', mat: 'cable' },
    { test: 'holder', mat: 'polymer' }, { test: 'tray', mat: 'polymer' }, { test: 'spacer', mat: 'polymer' },
    { test: 'foam', mat: 'soft' }, { test: 'seal', mat: 'soft' }, { test: 'tape', mat: 'soft' },
    { test: 'screw', mat: 'steel' }, { test: 'bolt', mat: 'steel' }, { test: 'nut', mat: 'steel' },
    { test: 'washer', mat: 'steel' },
    { test: 'casing', mat: 'casing' }, { test: 'enclosure', mat: 'casing' },
    { test: 'housing', mat: 'casing' }, { test: 'chassis', mat: 'casing' }, { test: 'case', mat: 'casing' }
  ];
  function std(color, metalness, roughness) {
    return new THREE.MeshStandardMaterial({ color: color, metalness: metalness, roughness: roughness, side: THREE.DoubleSide });
  }
  var MATS = null;
  function paletteFor(name) {
    if (!MATS) {
      MATS = {
        casing: std(0x171b23, 0.62, 0.44), lid: std(0x272d38, 0.70, 0.34),
        polymer: std(0x2b303b, 0.10, 0.82), cell: std(0xb9c0ca, 0.92, 0.26),
        busbar: std(0xc08842, 0.94, 0.24), board: std(0x16402f, 0.32, 0.58),
        cable: std(0x0c0e14, 0.24, 0.74), soft: std(0x23262f, 0.06, 0.92),
        steel: std(0x8d949e, 0.96, 0.30), neutral: std(0x4a505c, 0.55, 0.48)
      };
    }
    var lower = (name || '').toLowerCase();
    for (var i = 0; i < MAT_RULES.length; i++) {
      if (lower.indexOf(MAT_RULES[i].test) !== -1) return MATS[MAT_RULES[i].mat];
    }
    return MATS.neutral;
  }
  var SIZE = 1100;
  var logEl = document.getElementById('log');
  var lines = [];
  function log(t) { lines.push(t); logEl.textContent = lines.join('\n'); }

  var canvas = document.createElement('canvas');
  canvas.width = canvas.height = SIZE;
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(SIZE, SIZE, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.06;
  renderer.setClearColor(0x000000, 0);

  /* The hero's studio, so a tile and the live pack look like the same product. */
  function buildEnvScene() {
    var env = new THREE.Scene();
    var geo = new THREE.PlaneGeometry(1, 1);
    function panel(hex, intensity, pos, rot, sx, sy) {
      var mat = new THREE.MeshBasicMaterial({ color: hex, side: THREE.DoubleSide });
      mat.color.multiplyScalar(intensity);
      var m = new THREE.Mesh(geo, mat);
      m.position.set(pos[0], pos[1], pos[2]);
      m.rotation.set(rot[0], rot[1], rot[2]);
      m.scale.set(sx, sy, 1);
      env.add(m);
    }
    panel(0x11151f, 1.0, [0, 0, -14], [0, 0, 0], 40, 40);
    panel(0xffffff, 4.2, [0, 9, 0.5], [-Math.PI / 2, 0, 0], 15, 15);
    panel(0xffd9ab, 2.1, [0, 2.6, -9.5], [0, 0, 0], 15, 9);
    panel(0x9dc0ff, 1.35, [-8.5, 2.2, 2], [0, Math.PI / 2, 0], 13, 9);
    panel(0xffffff, 0.85, [8.5, 2.2, 2], [0, -Math.PI / 2, 0], 13, 9);
    return env;
  }

  var pmrem = new THREE.PMREMGenerator(renderer);
  var envTarget = pmrem.fromScene(buildEnvScene(), 0.04);

  function standardise(root, usePalette) {
    var converted = {};
    root.traverse(function (child) {
      if (!child.isMesh || !child.material) return;
      if (usePalette) { child.material = paletteFor(child.name); return; }
      var source = Array.isArray(child.material) ? child.material[0] : child.material;
      if (source.isMeshStandardMaterial) { source.side = THREE.DoubleSide; return; }
      if (!converted[source.uuid]) {
        var shininess = typeof source.shininess === 'number' ? source.shininess : 30;
        var specular = source.specular ? (source.specular.r + source.specular.g + source.specular.b) / 3 : 0.2;
        converted[source.uuid] = new THREE.MeshStandardMaterial({
          color: WSTCadColour.fromMaterial(source, THREE),
          roughness: Math.max(0, Math.min(1, 1 - shininess / 120)),
          metalness: Math.max(0, Math.min(1, specular * 1.2)),
          side: THREE.DoubleSide
        });
      }
      child.material = converted[source.uuid];
    });
  }

  function loadModel(url) {
    return new Promise(function (res, rej) {
      if (/\.wstm$/i.test(url)) WSTMLoader.load(url, res, undefined, rej);
      else new THREE.FBXLoader().load(url, res, undefined, rej);
    });
  }

  document.getElementById('go').addEventListener('click', async function () {
    lines = [];
    for (var i = 0; i < MODELS.length; i++) {
      var entry = MODELS[i];
      var started = performance.now();
      log('loading ' + entry.file + ' ...');
      var root = await loadModel('../' + entry.file);
      standardise(root, entry.palette);

      var scene = new THREE.Scene();
      scene.environment = envTarget.texture;
      var group = new THREE.Group();
      scene.add(group);
      group.add(root);

      var box = new THREE.Box3().setFromObject(root);
      var size = new THREE.Vector3();
      var mid = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(mid);
      root.position.sub(mid);
      /* Three-quarter view, the angle the pack is shown at everywhere else. */
      group.rotation.y = -0.62;
      group.rotation.x = -0.1;
      group.updateMatrixWorld(true);

      var camera = new THREE.PerspectiveCamera(30, 1, 0.1, 6000);
      var turned = new THREE.Box3().setFromObject(group);
      var turnedSize = new THREE.Vector3();
      turned.getSize(turnedSize);
      var reach = Math.max(turnedSize.x, turnedSize.y) / 2;
      var depth = turnedSize.z / 2;
      var distance = reach / Math.tan(camera.fov * Math.PI / 360) * 1.04 + depth;
      camera.position.set(0, 0, distance);
      camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix();

      renderer.render(scene, camera);
      /* Cropped to what was actually drawn, so every tile carries the product
         and not a different amount of empty space around it. */
      var flat = document.createElement('canvas');
      flat.width = flat.height = SIZE;
      var ctx = flat.getContext('2d');
      ctx.drawImage(canvas, 0, 0);
      var pixels = ctx.getImageData(0, 0, SIZE, SIZE).data;
      var minX = SIZE, minY = SIZE, maxX = -1, maxY = -1;
      for (var y = 0; y < SIZE; y++) {
        for (var x = 0; x < SIZE; x++) {
          if (pixels[(y * SIZE + x) * 4 + 3] > 8) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      var pad = 8;
      minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
      maxX = Math.min(SIZE - 1, maxX + pad); maxY = Math.min(SIZE - 1, maxY + pad);
      var cropped = document.createElement('canvas');
      cropped.width = Math.max(1, maxX - minX + 1);
      cropped.height = Math.max(1, maxY - minY + 1);
      cropped.getContext('2d').drawImage(flat, minX, minY, cropped.width, cropped.height, 0, 0, cropped.width, cropped.height);
      var blob = await new Promise(function (res) { cropped.toBlob(res, 'image/png'); });
      var bytes = new Uint8Array(await blob.arrayBuffer());
      var response = await fetch('/__save?path=' + encodeURIComponent(entry.out), { method: 'POST', body: bytes });
      log('  ' + entry.out + ': ' + (bytes.length / 1024).toFixed(0) + ' KB, ' +
          response.status + ', ' + Math.round((performance.now() - started) / 1000) + 's');

      var preview = document.createElement('img');
      preview.src = cropped.toDataURL('image/png');
      document.getElementById('shots').appendChild(preview);

      group.remove(root);
      root.traverse(function (child) { if (child.isMesh) child.geometry.dispose(); });
    }
    log('done.');
  });
})();
</script>
</body>
</html>
