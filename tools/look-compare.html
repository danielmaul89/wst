<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Look compare (dev tool)</title>
<style>
  body{ font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; margin:0; color:#111; background:#e9eaec; }
  header{ padding:12px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  header input{ font:inherit; width:60px; }
  button{ font:inherit; padding:4px 10px; }
  #pair{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 8px 8px; }
  #pair.overlay{ grid-template-columns:1fr; }
  .cell{ position:relative; background:#fff; aspect-ratio:1800/486; overflow:hidden; }
  .cell img, .cell canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .cell span{ position:absolute; left:8px; top:6px; font-size:12px; color:#555; z-index:2; }
  #pair.overlay #refCell{ display:none; }
  #pair.overlay #overlayImg{ display:block; }
  #overlayImg{ display:none; opacity:.5; pointer-events:none; z-index:1; }
  #status{ color:#555; }
</style>
</head>
<body>
<header>
  <strong>Look compare</strong>
  <label>model <input id="model" value="wl03" style="width:80px"></label>
  <label>az <input id="az" type="number" step="1"></label>
  <label>el <input id="el" type="number" step="1"></label>
  <label>fov <input id="fov" type="number" step="1"></label>
  <label>dist <input id="dist" type="number" step="0.1"></label>
  <label>pan x <input id="px" type="number" step="0.005"></label>
  <label>pan y <input id="py" type="number" step="0.005"></label>
  <button id="overlay">Overlay</button>
  <span id="status">loading…</span>
</header>
<p style="margin:0 16px 8px;color:#555">Renders a trimmed model with its look file next to the client's
  reference render, so materials and lighting can be matched by eye. Development tool: the site never loads it.
  <code>window.lookJson()</code> returns the look as JSON.</p>
<div id="pair">
  <div class="cell"><span>live (three.js)</span><canvas id="c"></canvas><img id="overlayImg" alt=""></div>
  <div class="cell" id="refCell"><span>client render</span><img id="ref" alt=""></div>
</div>

<script src="../assets/vendor/three.r128.min.js"></script>
<script src="../assets/vendor/fflate.min.js"></script>
<script src="../assets/scripts/wstm-loader.js"></script>
<script src="../assets/scripts/wst-model-look.js"></script>
<script>
(function () {
  'use strict';

  /* Per model: the reference render, the camera that matches it, and the
     look as rules. Each palette entry is linear colour, metalness, roughness
     and, optionally, emissive strength (lit LEDs); each rule maps part names
     (and, for multi-colour CAD parts, the exported colour) to an entry. The
     first rule that matches wins. */
  var SETUPS = {
    wl03: {
      ref: 'reference/wl03-render.png',
      /* Fitted to six corners of the unit picked off the render (4px rms). */
      view: { az: 35.5, el: 10, fov: 4.47, dist: 8.2, px: 0.0197, py: 0.07 },
      palette: {
        top:      [0.012, 0.012, 0.013, 0, 0.72],  // powder-coated top cover
        steel:    [0.55, 0.55, 0.56, 1, 0.34],         // brushed stainless shell and brackets
        bezel:    [0.014, 0.014, 0.015, 0, 0.36],      // black front bezel
        black:    [0.012, 0.012, 0.013, 0, 0.45],      // black plastics, jacks, harness
        window:   [0.004, 0.004, 0.005, 0, 0.12],      // display window
        greenOn:  [0.1, 1.0, 0.18, 0, 0.3, 1.0],
        yellowOn: [1.0, 0.8, 0.05, 0, 0.3, 1.0],
        ledOff:   [0.03, 0.03, 0.03, 0, 0.3],
        pcb:      [0.012, 0.06, 0.02, 0, 0.45],
        orange:   [0.76, 0.24, 0.0, 0, 0.45],
        greyPlas: [0.35, 0.35, 0.36, 0, 0.5],
        fr4:      [0.02, 0.02, 0.02, 0, 0.6]
      },
      rules: [
        { name: 'fr4_top', look: 'top' },
        { name: 'fr4_bottom', look: 'fr4' },
        { name: 'plastic_front', look: 'bezel' },
        { name: 'pet_front_metal', look: 'black' },
        { name: /^cube$/, look: 'window' },
        { name: 'side_metal', look: 'steel' },
        { name: 'rear_metal', look: 'steel' },
        { name: 'connector_metal', look: 'steel' },
        { name: 'rack_bracket', look: 'steel' },
        { name: 'xcadmodel', look: 'black' },   // the plate behind the grille: the holes read black
        { name: 'fans_bracket', look: 'steel' },
        { name: 'ldk', led: 'on', look: function (m) { return /green/i.test(m.name) ? 'greenOn' : 'yellowOn'; } },
        { name: 'ldk', look: 'ledOff' },
        { name: 'ens', colour: '003700', look: 'pcb' },
        { name: 'ens', look: 'pcb' },
        { name: 'gridpower', colour: 'e28706', look: 'orange' },
        { name: 'gridpower', colour: 'ff0101', look: 'orange' },
        { name: 'gridpower', look: 'black' },
        { name: 'harness', look: 'black' },
        { name: 'mj-', look: 'black' },
        { name: 'prt', look: 'black' },
        { name: 'fan', look: 'black' },
        { name: 'rnb', look: 'greyPlas' },
        { name: 't-25', look: 'greyPlas' },
        /* Everything else is a fastener - screws, nuts, press-in studs,
           washers, standoff bolts - and is left out (-1), as in the home
           hero: at page size they read as specks, and in the teardown as
           a cloud of them. */
        { name: '', look: null }
      ],
      /* Which LEDs are lit in the render: SOC shows three green of four,
         Charge/Discharge shows yellow; Error and Init are dark. LEDs are
         picked by colour and counted from the left as seen from the front. */
      lit: { green: 3, yellow: 1, red: 0 },
      /* Print the CAD does not carry, drawn flat onto the front faces in
         millimetres of the model: x is the face's depth, z and y its
         extent. The front faces -x. */
      decals: [
        { name: 'legend', parent: 'plastic_front', x: -287.9, z: [58, 102], y: [24, 54], draw: ledLabels },
        { name: 'sticker', parent: 'plastic_front', x: -288.6, z: [-185, -160], y: [17, 61], draw: manualSticker }
      ],
      /* The studio: a dim room with softboxes placed by what each face of
         the unit reflects from the render's three-quarter view. The vented
         side looks forward, down and to the right, so a large box there
         gives the steel its clean bright sheet; the top looks away and up at
         a grazing angle, so that region stays dark and the powder coat reads
         dark rather than grey. The bezel sees a brighter room (glossRoom):
         glossy black plastic shows its grille facets only by what they
         reflect, and the dark room leaves them flat. */
      studio: {
        room: 0.06,
        glossRoom: 0.45,
        gloss: ['bezel'],
        panels: [
          { color: '#ffffff', intensity: 1.4, dir: [0, 1, 0], size: [16, 12] },             // overhead
          { color: '#ffffff', intensity: 1.15, dir: [0.79, -0.1, -0.57], size: [18, 5] },    // the steel side's sheet, bright above
          { color: '#ffffff', intensity: 0.5, dir: [0.79, -0.42, -0.57], size: [18, 5] },    // and dimmer below
          { color: '#fff4e8', intensity: 1.1, dir: [-0.8, 0.45, -0.4], size: [9, 7] },       // key box over the camera's shoulder
          { color: '#ffffff', intensity: 0.45, dir: [-0.79, -0.24, 0.57], size: [12, 6] },   // a soft sheen on the bezel
          { color: '#f4f5f7', intensity: 0.45, dir: [0, -1, 0], size: [30, 30] }             // bright floor
        ],
        key: { color: '#ffffff', intensity: 1.1, dir: [-0.8, 3, -0.6] },   // overhead, a little towards the camera
        hemi: 0.25,
        exposure: 1.0
      }
    }
  };

  /* The indicator legend beside the LEDs: one row per LED row (the rows sit
     5.5mm apart, SOC level with the top row at y 50.2), with the serial
     line under them. Sizes are taken off the render, where the longest
     label runs 37mm and ends 7mm short of the first LED. */
  function ledLabels(ctx, mm, top, left) {
    ctx.fillStyle = '#e9eaec';
    ctx.textBaseline = 'middle';
    var size = 20;
    ctx.font = size + 'px Arial, Helvetica, sans-serif';
    size *= (37 * mm) / ctx.measureText('ChargeDischarge').width;
    ctx.font = size + 'px Arial, Helvetica, sans-serif';
    var x = (61.8 - left) * mm;
    ['SOC', 'ChargeDischarge', 'Error', 'Init'].forEach(function (label, i) {
      ctx.fillText(label, x, (top - (50.2 - i * 5.5)) * mm);
    });
    var serial = 'S/N:WO-2U-A-07-001';
    var small = 20;
    ctx.font = small + 'px Arial, Helvetica, sans-serif';
    small *= (29 * mm) / ctx.measureText(serial).width;
    ctx.font = small + 'px Arial, Helvetica, sans-serif';
    ctx.fillText(serial, x + 2 * mm, (top - 27.6) * mm);
  }

  /* The "refer to the manual" label on the handle face: a white card with
     the blue ISO 7010 M002 sign over a QR code. The QR here is a stand-in
     pattern (three finder squares over a fixed scatter); the client's label
     artwork would replace it. */
  function manualSticker(ctx, mm, top, left, w, h) {
    ctx.fillStyle = '#f4f4f2';
    roundRect(ctx, 0, 0, w, h, 1.2 * mm);
    ctx.fill();
    var cx = w / 2, cy = 11.5 * mm, r = 9.5 * mm;
    ctx.fillStyle = '#1f5aa6';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 3.2 * mm, cy - 4.6 * mm, 1.9 * mm, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 6 * mm, cy - 1.8 * mm); ctx.lineTo(cx - 0.6 * mm, cy - 1.8 * mm);
    ctx.lineTo(cx - 0.6 * mm, cy + 6.5 * mm); ctx.lineTo(cx - 6 * mm, cy + 6.5 * mm);
    ctx.closePath(); ctx.fill();
    ctx.save();
    ctx.translate(cx + 2.4 * mm, cy + 1.2 * mm);
    ctx.rotate(-0.35);
    ctx.fillRect(-3 * mm, -4.6 * mm, 6 * mm, 8.6 * mm);
    ctx.fillStyle = '#1f5aa6';
    ctx.fillRect(-0.25 * mm, -4.2 * mm, 0.5 * mm, 7.8 * mm);
    ctx.restore();
    var n = 21, cell = 15 * mm / n, ox = (w - n * cell) / 2, oy = h - 3.5 * mm - n * cell;
    ctx.fillStyle = '#111';
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    function finder(fx, fy) {
      ctx.fillRect(ox + fx * cell, oy + fy * cell, 7 * cell, 7 * cell);
      ctx.fillStyle = '#f4f4f2';
      ctx.fillRect(ox + (fx + 1) * cell, oy + (fy + 1) * cell, 5 * cell, 5 * cell);
      ctx.fillStyle = '#111';
      ctx.fillRect(ox + (fx + 2) * cell, oy + (fy + 2) * cell, 3 * cell, 3 * cell);
    }
    for (var i = 0; i < n; i++) {
      for (var j = 0; j < n; j++) {
        var inFinder = (i < 8 && j < 8) || (i > n - 9 && j < 8) || (i < 8 && j > n - 9);
        if (!inFinder && rnd() < 0.5) ctx.fillRect(ox + i * cell, oy + j * cell, cell, cell);
      }
    }
    finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  /* A decal's artwork, drawn at 24px per millimetre with the canvas's left
     edge at the decal's lowest z. */
  function drawDecal(d) {
    var mm = 24;
    var w = Math.round((d.z[1] - d.z[0]) * mm), h = Math.round((d.y[1] - d.y[0]) * mm);
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    d.draw(c.getContext('2d'), mm, d.y[1], d.z[0], w, h);
    return c;
  }

  var params = new URLSearchParams(location.search);
  var modelKey = params.get('model') || 'wl03';
  var setup = SETUPS[modelKey];
  var statusEl = document.getElementById('status');
  if (!setup) { statusEl.textContent = 'no setup for ' + modelKey; return; }
  document.getElementById('model').value = modelKey;
  document.getElementById('ref').src = setup.ref;
  document.getElementById('overlayImg').src = setup.ref;

  var view = {};
  ['az', 'el', 'fov', 'dist', 'px', 'py'].forEach(function (k) {
    view[k] = params.has(k) ? parseFloat(params.get(k)) : setup.view[k];
    var input = document.getElementById(k);
    input.value = view[k];
    input.addEventListener('input', function () { view[k] = parseFloat(input.value) || 0; place(); });
  });
  document.getElementById('overlay').addEventListener('click', function () {
    document.getElementById('pair').classList.toggle('overlay');
    resize();
  });

  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = setup.studio.exposure;
  renderer.setClearColor(0xffffff, 1);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(14, 1800 / 486, 1, 20000);

  var key = new THREE.DirectionalLight(0xffffff, 1);
  scene.add(key, key.target);
  var fill = new THREE.HemisphereLight(0xffffff, 0xe6e6e6, setup.studio.hemi);
  scene.add(fill);

  /* A soft contact shadow, drawn rather than cast: a blurred rectangle the
     shape of the unit's footprint, darkest right under it. */
  function contactShadow() {
    var size = 512, c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    ctx.filter = 'blur(40px)';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(size * 0.2, size * 0.2, size * 0.6, size * 0.6);
    ctx.filter = 'blur(10px)';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(size * 0.24, size * 0.24, size * 0.52, size * 0.52);
    var mat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, opacity: 0.5, toneMapped: false });
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.renderOrder = -1;
    return mesh;
  }
  var floor = contactShadow();
  scene.add(floor);

  var model = null, box = new THREE.Box3(), centre = new THREE.Vector3(), radius = 1;
  var look = null, decalCanvases = [];

  function hex(c) { return c.getHexString(); }

  function matches(rule, mesh) {
    var name = (mesh.name || '').toLowerCase();
    var nameOk = rule.name instanceof RegExp ? rule.name.test(name) : name.indexOf(rule.name) !== -1;
    if (!nameOk) return false;
    if (rule.colour && hex(mesh.userData.cadColour) !== rule.colour) return false;
    if (rule.led && mesh.userData.led !== rule.led) return false;
    return true;
  }

  /* Marks the LEDs the render shows lit: by colour, counted from the left as
     seen from the front (the front faces -x, so left is -z). Each LED is a
     white body with a coloured lens set inside it, and the body is what
     shows, so both halves take the state. */
  function markLeds(meshes) {
    var byColour = { green: {}, yellow: {}, red: {} };
    var tmp = new THREE.Vector3();
    meshes.forEach(function (m) {
      if (!/ldk/i.test(m.name)) return;
      var colour = /green/i.test(m.name) ? 'green' : /yellow/i.test(m.name) ? 'yellow' : 'red';
      var c = new THREE.Box3().setFromObject(m).getCenter(tmp);
      var at = Math.round(c.y) + ',' + Math.round(c.z);
      (byColour[colour][at] = byColour[colour][at] || { z: c.z, parts: [] }).parts.push(m);
    });
    Object.keys(byColour).forEach(function (colour) {
      Object.values(byColour[colour])
        .sort(function (a, b) { return a.z - b.z; })
        .forEach(function (led, i) {
          var state = i < (setup.lit[colour] || 0) ? 'on' : 'off';
          led.parts.forEach(function (m) { m.userData.led = state; });
        });
    });
  }

  /* The rules resolved into the look file's form: a palette and an entry per
     mesh, the studio with its gloss entries as palette indices, and each
     decal as the image it is saved to. */
  function buildLook(meshes) {
    var names = Object.keys(setup.palette);
    var studio = JSON.parse(JSON.stringify(setup.studio));
    studio.gloss = studio.gloss.map(function (n) { return names.indexOf(n); });
    return {
      v: 1,
      palette: names.map(function (n) { return setup.palette[n].map(function (x) { return +x.toFixed(4); }); }),
      mesh: meshes.map(function (m) {
        var rule = setup.rules.find(function (r) { return matches(r, m); });
        return names.indexOf(typeof rule.look === 'function' ? rule.look(m) : rule.look);
      }),
      studio: studio,
      decals: (setup.decals || []).map(function (d) {
        return { src: modelKey + '.' + d.name + '.png', parent: d.parent, x: d.x, z: d.z, y: d.y };
      })
    };
  }

  window.lookJson = function () { return JSON.stringify(look); };

  /* The live render and the reference stacked at the reference's own size,
     written back through the dev server's /__save. */
  window.snapshot = function (path) {
    var ref = document.getElementById('ref');
    var w = ref.naturalWidth, h = ref.naturalHeight;
    renderer.setPixelRatio(1);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    var out = document.createElement('canvas');
    out.width = w; out.height = h * 2;
    var ctx = out.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h * 2);
    ctx.drawImage(canvas, 0, 0);
    ctx.drawImage(ref, 0, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    resize();
    return new Promise(function (res) { out.toBlob(res, 'image/png'); })
      .then(function (blob) { return fetch('/__save?path=' + encodeURIComponent(path), { method: 'POST', body: blob }); })
      .then(function (r) { return r.json(); });
  };

  /* Writes the look file and its decal images beside the model. */
  window.saveLook = function () {
    function save(path, body) {
      return fetch('/__save?path=' + encodeURIComponent('assets/models/' + path), { method: 'POST', body: body })
        .then(function (r) { return r.json(); });
    }
    var writes = (setup.decals || []).map(function (d, i) {
      return new Promise(function (res) { decalCanvases[i].toBlob(res, 'image/png'); })
        .then(function (blob) { return save(look.decals[i].src, blob); });
    });
    writes.push(save(modelKey + '.look.json', window.lookJson()));
    return Promise.all(writes);
  };

  function place() {
    if (!model) return;
    var az = THREE.MathUtils.degToRad(view.az), el = THREE.MathUtils.degToRad(view.el);
    /* az 0 looks straight at the front (-x); positive swings towards the
       vented side (-z). */
    var dir = new THREE.Vector3(-Math.cos(el) * Math.cos(az), Math.sin(el), -Math.cos(el) * Math.sin(az));
    camera.fov = view.fov;
    var dist = radius * view.dist;   // in the unit's own radii
    camera.near = dist / 50; camera.far = dist * 50;
    camera.updateProjectionMatrix();
    camera.position.copy(centre).addScaledVector(dir, dist);
    camera.lookAt(centre);
    /* Pan as a share of the frame, so the unit can sit where it sits in
       the reference without changing the perspective. */
    var w = 1800, h = 1800 / camera.aspect;
    camera.setViewOffset(w, h, (view.px || 0) * w, (view.py || 0) * h, w, h);
  }

  function resize() {
    var r = canvas.getBoundingClientRect();
    renderer.setSize(Math.round(r.width), Math.round(r.height), false);
    camera.aspect = r.width / r.height;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  WSTMLoader.load('../assets/models/' + modelKey + '.wstm', function (root) {
    root.updateMatrixWorld(true);
    var meshes = [];
    root.traverse(function (n) {
      if (!n.isMesh) return;
      n.userData.cadColour = n.material.color.clone();
      meshes.push(n);
    });
    markLeds(meshes);
    look = buildLook(meshes);
    var envs = WSTModelLook.environments(THREE, renderer, look);
    scene.environment = envs.main;
    WSTModelLook.applyMaterials(THREE, root, look, envs);
    decalCanvases = (setup.decals || []).map(function (d, i) {
      var c = drawDecal(d);
      WSTModelLook.makeDecal(THREE, root, look.decals[i], new THREE.CanvasTexture(c));
      return c;
    });
    model = root;
    scene.add(root);
    box.setFromObject(root);
    box.getCenter(centre);
    radius = box.getSize(new THREE.Vector3()).length() / 2;
    var span = box.getSize(new THREE.Vector3());
    floor.position.set(centre.x, box.min.y - 0.2, centre.z);
    floor.scale.set(span.x / 0.52, span.z / 0.52, 1);
    WSTModelLook.placeKey(THREE, key, look.studio, centre, radius);
    resize();
    place();
    statusEl.textContent = meshes.length + ' meshes';
    window.__model = root;
    window.__lookReady = true;
  }, undefined, function (err) { statusEl.textContent = 'failed: ' + err.message; });

  renderer.setAnimationLoop(function () { renderer.render(scene, camera); });
})();
</script>
</body>
</html>
